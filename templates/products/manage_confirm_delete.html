{% extends "base.html" %}
{% block content %}
<!-- templates/products/manage_confirm_delete.html -->

<div class="panel" style="text-align:center;">
  <h3>Delete {{ object.name }}</h3>
</div>

<div class="panel" style="text-align:center;">
  <form method="post">
    {% csrf_token %}
    <p>Are you sure? This can't be undone.</p>
    <button type="submit">Yes, delete</button>
  </form>
</div>

<div class="panel" style="text-align: center">
  <a href="{% url 'products:manage_list' store.slug %}">&larr; Back to products</a>
</div>

{% endblock %}
